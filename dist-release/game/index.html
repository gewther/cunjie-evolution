/* v4.2.1 mobile controls: fullscreen is physically separated from top-right settings.
   Fixed bottom-left works in both portrait/landscape, respecting gesture/nav safe areas. */
#quick #fullBtn {
  position: fixed;
  top: auto;
  right: auto;
  left: max(12px, env(safe-area-inset-left));
  bottom: max(12px, env(safe-area-inset-bottom));
  z-index: 5;
  min-width: 75px;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid #8abfb078;
  border-radius: 11px;
  background: #112730de;
  box-shadow: 0 2px 12px #061014a6;
  backdrop-filter: blur(5px);
}
#quick { right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); }
@media (max-height: 450px) {
  #quick #fullBtn { bottom: max(8px, env(safe-area-inset-bottom)); left: max(8px, env(safe-area-inset-left)); min-height: 40px; min-width: 72px; }
  #quick { right: max(8px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); }
}
@media (orientation: portrait) {
  #quick #fullBtn { bottom: max(16px, env(safe-area-inset-bottom)); left: max(12px, env(safe-area-inset-left)); }
  #quick { gap: 7px; }
}
