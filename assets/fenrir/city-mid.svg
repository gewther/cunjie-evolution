<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
<defs>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#35576a"/><stop offset="1" stop-color="#172d3d"/></linearGradient>
 <linearGradient id="shop" x2="0" y2="1"><stop stop-color="#263f50"/><stop offset="1" stop-color="#101f2c"/></linearGradient>
 <pattern id="office" width="26" height="31" patternUnits="userSpaceOnUse"><rect x="4" y="5" width="15" height="18" rx="1" fill="#8dc5d7" opacity=".25"/><path d="M0 27H26" stroke="#9bb7c3" stroke-opacity=".15"/></pattern>
 <pattern id="warmwin" width="34" height="29" patternUnits="userSpaceOnUse"><rect x="5" y="5" width="18" height="15" fill="#e9c78a" opacity=".5"/></pattern>
</defs>
<!-- three-storey commercial block: approximately 3 x 3.2 m -->
<g>
