</g>
<!-- low retail street -->
<g>
 <path d="M455 197V76H650V197Z" fill="url(#shop)" stroke="#8199a5" stroke-opacity=".35"/>
 <path d="M455 76H650V197H455Z" fill="url(#warmwin)"/>
