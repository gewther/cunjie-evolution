name: Fenrir scene checks
on:
  push:
    branches:
      - feat/fenrir-city-scale-scene
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fenrir-scene-check.yml"
      - "src/fenrir-scene-v1.js"
      - "src/fenrir-scene-bridge.js"
      - "src/fenrir-controls.js"
      - "src/free-impact-v6.js"
      - "src/immersion-v1.js"
      - "src/tech-dread-v1.js"
      - "src/art-overhaul-v1.js"
      - "src/art-hd-geo.json"
      - "assets/fenrir/*.svg"
      - "assets/tinies/*.webp"
      - "assets/rooms/*.webp"
      - "assets/*-hd/*.webp"
      - "dist-release/game/scripts/host-2.js"
      - "dist-release/game/scripts/impact-host-3.js"
      - "dist-release/game/scripts/touch-v1-impact-host-1.js"
      - "dist-release/game/scripts/fenrir-scene-v1.js"
      - "dist-release/game/scripts/tech-dread-v1.js"
      - "dist-release/game/assets/**/*"
      - "dist-release/game/data/04-images-deferred.js"
      - "dist-release/game/data/touch-v1-*.js"
      - "tools/build_all.py"
      - "tools/build_art_v1.cjs"
      - "tools/build_fenrir_scene.cjs"
      - "tools/build_free_impact.cjs"
      - "tools/build_offline_html.py"
      - "tools/build_tech_dread.cjs"
      - "tools/test_art_hd.cjs"
      - "tools/test_fenrir_scene.cjs"
      - "tools/test_tech_dread.cjs"
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build offline HTML and run release regressions
        run: python3 tools/build_all.py --from-release
      - name: Verify generated release matches commit
        run: |
          git diff --exit-code -- dist-release/game
          test -s dist/cunjie-offline.html
